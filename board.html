<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Board Live Classroom</title><link rel="stylesheet" href="/assets/css/classroom.css"></head>
<body>
<div class="classroom">
<header class="topbar"><div class="room-title"><strong id="roomName">Connecting…</strong><span id="roomMeta">Smart Board</span></div><div class="top-actions"><span id="participantCount" class="pill">0 participants</span><span id="roomCode" class="pill room-code">—</span><button id="participantsBtn" class="top-btn">People</button><button id="chatBtn" class="top-btn">Chat</button><button id="leaveBtn" class="top-btn">Leave</button><button id="endBtn" class="top-btn danger" style="display:none">End class</button></div></header>
<main class="stage"><section class="board-wrap" id="boardWrap"><canvas id="whiteboard"></canvas><div id="participants" class="participants"></div><div id="toast" class="toast"></div>
<div id="controlPanel" class="control-panel"><h3>Classroom controls</h3><div id="peopleList"></div><hr><div class="settings"><label>Student drawing <input id="settingDrawing" type="checkbox"></label><label>Student microphone <input id="settingMic" type="checkbox"></label><label>Student camera <input id="settingCamera" type="checkbox"></label><label>Student screen share <input id="settingScreen" type="checkbox"></label></div><button id="saveSettings" class="top-btn" style="margin-top:12px;width:100%">Save settings</button></div></section>
<aside id="chat" class="chat"><div class="chat-head">Live chat</div><div id="messages" class="messages"></div><div class="composer"><textarea id="messageInput" placeholder="Message everyone…"></textarea><button id="sendMessage">➤</button></div></aside></main>
<footer class="toolbar">
<button class="tool" id="toolsToggle" title="Tools">☰</button><button class="tool active" id="penTool" title="Pen">✎</button><button class="tool" id="highlighterTool" title="Highlighter">▰</button><button class="tool" id="eraserTool" title="Eraser">⌫</button><button class="tool" id="pointerTool" title="Pointer">●</button><div class="sep"></div>
<button class="color" data-color="#000000" style="background:#000"></button><button class="color" data-color="#ef4444" style="background:#ef4444"></button><button class="color" data-color="#22c55e" style="background:#22c55e"></button><button class="color" data-color="#2563eb" style="background:#2563eb"></button><button class="color" data-color="#facc15" style="background:#facc15"></button><input id="width" class="slider" type="range" min="1" max="40" value="3" title="Pen width"><div class="sep"></div>
<button class="tool" id="undo" title="Undo">↶</button><button class="tool" id="redo" title="Redo">↷</button><button class="tool" id="clear" title="Erase all">⌫</button><button class="tool" id="cameraBtn" title="Camera">📷</button><button class="tool" id="micBtn" title="Microphone">🎙</button><button class="tool" id="shareBtn" title="Screen share">▣</button><button class="tool" id="fullscreenBtn" title="Fullscreen">⛶</button><button class="tool" id="chatToolBtn" title="Chat">💬</button>
</footer></div>
<div id="endOverlay" class="end-overlay"><div class="end-card"><h2 id="endTitle">Classroom ended</h2><p id="endText">The teacher has ended this classroom.</p><button onclick="location.href='/dashboard.html'">Back to dashboard</button></div></div>
<script src="/assets/js/classroom.js"></script></body></html>
