<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    background:#f4f4f4;
}

.form-box{
    position:absolute;
    right:0;
    top:0;
    width:50%;
    height:100vh;
    background:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#333;
    text-align:center;
    padding:40px;
    z-index:1;
    transition:.6s ease-in-out 1.2s, visibility 0s;
}

.form{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    gap:16px;
    text-align:center;
}

/* Form Text */
.title{
    font-weight:bold;
    font-size:1.8rem;
}

.subtitle{
    font-size:1rem;
    color:#666;
}

/* Input Container */
.form-container{
    overflow:hidden;
    border-radius:8px;
    background:#fff;
    margin:1rem 0 .5rem;
    width:100%;
    border:1px solid #d3d3d3;
}

.input{
    background:none;
    border:0;
    outline:0;
    height:45px;
    width:100%;
    border-bottom:1px solid #d3d3d3;
    font-size:.9rem;
    padding:8px 15px;
}

.input:last-child{
    border-bottom:none;
}

/* Button */
.form button{
    background-color:#0066ff;
    color:#fff;
    border:0;
    border-radius:24px;
    padding:12px 16px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:background-color .3s ease;
}

.form button:hover{
    background-color:#005ce6;
}

/* Bottom Section */
.form-section{
    margin-top:20px;
    padding:16px;
    font-size:.9rem;
    background-color:#e0ecfb;
    border-radius:8px;
    width:100%;
    max-width:400px;
}

.form-section a{
    font-weight:bold;
    color:#0066ff;
    text-decoration:none;
}

.form-section a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="form-box">

    <form class="form">
        <span class="title">Sign Up</span>
        <span class="subtitle">Create a free account with your email.</span>

        <div class="form-container">
            <input type="text" class="input" placeholder="Full Name">
            <input type="email" class="input" placeholder="Email">
            <input type="password" class="input" placeholder="Password">
        </div>

        <button type="submit">Sign Up</button>
    </form>

    <div class="form-section">
        <p>Have an account? <a href="login.html">Log in</a></p>
    </div>

</div>

</body>
</html>
