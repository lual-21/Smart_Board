<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Board Classroom</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .classroom {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 60px;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #374151;
        }

        .class-info h2 {
            font-size: 17px;
            margin: 0;
        }

        .class-info span {
            color: #9ca3af;
            font-size: 12px;
        }

        .room-id {
            background: #1f2937;
            padding: 7px 12px;
            border-radius: 7px;
            font-size: 12px;
        }

        .main {
            flex: 1;
            min-height: 0;
            display: flex;
        }

        .workspace {
            flex: 1;
            min-width: 0;
            position: relative;
            background: white;
        }

        #whiteboard {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        .side-panel {
            width: 330px;
            background: #111827;
            border-left: 1px solid #374151;
            display: flex;
            flex-direction: column;
        }

        .participants {
            padding: 14px;
            border-bottom: 1px solid #374151;
            max-height: 220px;
            overflow-y: auto;
        }

        .panel-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .participant {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2563eb;
            display: grid;
            place-items: center;
            font-size: 13px;
        }

        .participant-name {
            font-size: 14px;
        }

        .participant-role {
            color: #9ca3af;
            font-size: 11px;
        }

        .videos {
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .video-tile {
            background: #000;
            aspect-ratio: 16 / 10;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 5px;
            left: 6px;
            background: rgba(0,0,0,.6);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .chat {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #374151;
        }

        .chat-header {
            padding: 12px;
            font-weight: bold;
            border-bottom: 1px solid #374151;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .message {
            margin-bottom: 12px;
        }

        .message-name {
            color: #60a5fa;
            font-size: 12px;
            font-weight: bold;
        }

        .message-text {
            font-size: 13px;
            line-height: 1.4;
        }

        .chat-form {
            display: flex;
            gap: 6px;
            padding: 10px;
        }

        .chat-form input {
            flex: 1;
            background: #1f2937;
            color: white;
            border: 1px solid #374151;
            padding: 9px;
            border-radius: 7px;
            outline: none;
        }

        .chat-form button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 0 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .controls {
            height: 70px;
            background: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #374151;
        }

        .control {
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #374151;
            color: white;
            cursor: pointer;
            font-size: 17px;
        }

        .control:hover {
            background: #4b5563;
        }

        .danger {
            background: #dc2626;
        }

        .teacher-control {
            background: #7c3aed;
        }

        .tools {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(17,24,39,.94);
            border-radius: 9px;
            padding: 7px;
            display: flex;
            gap: 5px;
        }

        .tool {
            border: none;
            background: #374151;
            color: white;
            padding: 7px 9px;
            border-radius: 5px;
            cursor: pointer;
        }

        .tool.active {
            background: #2563eb;
        }

        .teacher-bar {
            position: absolute;
            right: 12px;
            top: 12px;
            z-index: 10;
            display: none;
        }

        .teacher-bar button {
            border: none;
            background: #dc2626;
            color: white;
            padding: 9px 13px;
            border-radius: 7px;
            cursor: pointer;
        }

        @media (max-width: 900px) {

            .side-panel {
                width: 280px;
            }

        }

        @media (max-width: 700px) {

            .side-panel {
                display: none;
            }

        }

    </style>

</head>

<body>

<div class="classroom">

    <header class="topbar">

        <div class="class-info">

            <h2 id="className">
                Smart Board Classroom
            </h2>

            <span id="subject">
                Loading...
            </span>

        </div>

        <div class="room-id">

            ID:
            <strong id="roomId">
                ----
            </strong>

        </div>

    </header>

    <main class="main">

        <section class="workspace">

            <div class="tools">

                <button
                    class="tool active"
                    data-tool="pen"
                >
                    ✏️
                </button>

                <button
                    class="tool"
                    data-tool="highlighter"
                >
                    🖍️
                </button>

                <button
                    class="tool"
                    data-tool="eraser"
                >
                    🧹
                </button>

                <button
                    class="tool"
                    data-tool="pointer"
                >
                    🔴
                </button>

                <input
                    id="color"
                    type="color"
                    value="#000000"
                >

                <input
                    id="width"
                    type="range"
                    min="1"
                    max="30"
                    value="3"
                >

            </div>

            <div
                class="teacher-bar"
                id="teacherBar"
            >
                <button id="endClassBtn">
                    End Classroom
                </button>
            </div>

            <canvas id="whiteboard"></canvas>

        </section>

        <aside class="side-panel">

            <section class="participants">

                <div class="panel-title">
                    Participants
                    (<span id="participantCount">0</span>)
                </div>

                <div id="participants"></div>

            </section>

            <section class="videos">

                <div class="video-tile">

                    <video
                        id="localVideo"
                        autoplay
                        muted
                        playsinline
                    ></video>

                    <div class="video-label">
                        You
                    </div>

                </div>

            </section>

            <section class="chat">

                <div class="chat-header">
                    Live Chat
                </div>

                <div id="messages"></div>

                <form
                    class="chat-form"
                    id="chatForm"
                >

                    <input
                        id="messageInput"
                        placeholder="Send a message..."
                        autocomplete="off"
                    >

                    <button>
                        Send
                    </button>

                </form>

            </section>

        </aside>

    </main>

    <footer class="controls">

        <button
            class="control"
            id="micBtn"
            title="Microphone"
        >
            🎤
        </button>

        <button
            class="control"
            id="cameraBtn"
            title="Camera"
        >
            📹
        </button>

        <button
            class="control"
            id="screenBtn"
            title="Screen sharing"
        >
            🖥️
        </button>

        <button
            class="control"
            id="fullscreenBtn"
            title="Fullscreen"
        >
            ⛶
        </button>

        <button
            class="control danger"
            id="leaveBtn"
            title="Leave"
        >
            ☎
        </button>

    </footer>

</div>

<script src="./assets/js/classroom.js"></script>

</body>
</html>
